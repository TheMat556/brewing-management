name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Biome lint, format, and imports
        run: bun run check

      - name: TypeScript
        run: bun run typecheck

      - name: Unit tests
        run: bun run test

      - name: Production build
        run: bun run build

  integration:
    name: PostgreSQL integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Start local Supabase
        run: bun run db:start

      - name: Configure integration test environment
        shell: bash
        run: |
          bunx supabase status -o env > /tmp/supabase.env
          set -a
          . /tmp/supabase.env
          set +a

          cat > .env.test.local <<EOF
          TEST_SUPABASE_URL=$API_URL
          TEST_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY
          TEST_SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY
          TEST_DATABASE_URL=$DB_URL
          EOF

      - name: Run integration tests
        run: bun run test:integration

      - name: Stop local Supabase
        if: always()
        run: bunx supabase stop --no-backup
