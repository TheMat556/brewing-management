name: Deploy to Vercel

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      target:
        description: "Deployment target"
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production

permissions:
  contents: read

concurrency:
  group: vercel-${{ github.ref }}-${{ inputs.target || 'production' }}
  cancel-in-progress: false

env:
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  DEPLOY_TARGET: ${{ github.event_name == 'workflow_run' && 'production' || inputs.target }}

jobs:
  deploy:
    name: Deploy to Vercel
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ github.event_name == 'workflow_run' && 'production' || inputs.target }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Verify deployment secrets
        run: |
          test -n "$VERCEL_TOKEN"
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"

      - name: Show deployment target
        run: echo "Deploying '$DEPLOY_TARGET' from '$GITHUB_REF' ($GITHUB_SHA)"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Pull Vercel environment
        run: bunx vercel@latest pull --yes --environment="$DEPLOY_TARGET" --token="$VERCEL_TOKEN"

      - name: Build with Vercel
        run: |
          if [ "$DEPLOY_TARGET" = "production" ]; then
            bunx vercel@latest build --prod --token="$VERCEL_TOKEN"
          else
            bunx vercel@latest build --token="$VERCEL_TOKEN"
          fi

      - name: Deploy prebuilt output
        run: |
          if [ "$DEPLOY_TARGET" = "production" ]; then
            bunx vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"
          else
            bunx vercel@latest deploy --prebuilt --token="$VERCEL_TOKEN"
          fi
